<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A little recap of beautiful moments with you">
  <title>Today Is All About You | Happy Birthday!</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5efe4;
      --ink: #45353a;
      --wine: #a55062;
      --muted: #816e6c;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 8% 20%, rgba(222,191,171,.24), transparent 34rem),
        radial-gradient(ellipse at 94% 56%, rgba(213,164,164,.17), transparent 30rem),
        var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-synthesis: none;
    }
    .scrapbook {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background:
        repeating-linear-gradient(0deg, rgba(97,67,61,.018) 0 1px, transparent 1px 5px),
        radial-gradient(ellipse at 8% 20%, rgba(222,191,171,.24), transparent 34rem),
        radial-gradient(ellipse at 94% 56%, rgba(213,164,164,.17), transparent 30rem),
        var(--paper);
      color: var(--ink);
    }
    .scrapbook::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .16;
      background: repeating-linear-gradient(113deg, transparent 0 7px, rgba(104,76,66,.06) 7.5px 8px);
    }
    .scrapbook::after {
      content: "";
      position: fixed;
      inset: -18%;
      z-index: 0;
      pointer-events: none;
      opacity: .58;
      background:
        radial-gradient(ellipse at 16% 20%, rgba(212,143,165,.19), transparent 31%),
        radial-gradient(ellipse at 83% 34%, rgba(226,180,143,.19), transparent 30%),
        radial-gradient(ellipse at 55% 82%, rgba(184,145,183,.14), transparent 33%);
      animation: paper-aurora 32s ease-in-out infinite alternate;
      will-change: transform;
    }
    .scrapbook > * { position: relative; z-index: 1; }
    .scrapbook > .ambient-birthday { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .ambient-shape { position: absolute; display: block; animation: birthday-float 19s ease-in-out infinite; }
    .ambient-heart { color: rgba(165,80,98,.32); font: 26px/1 var(--serif); }
    .ambient-star { color: rgba(180,133,83,.5); font-size: 18px; animation-name: birthday-twinkle; }
    .ambient-heart-one { top: 16%; left: 7%; animation-delay: -5s; }
    .ambient-star-one { top: 28%; right: 9%; animation-delay: -9s; }
    .ambient-heart-two { top: 59%; right: 13%; font-size: 20px; animation-delay: -12s; }
    .ambient-star-two { top: 75%; left: 14%; animation-delay: -3s; }
    .ambient-heart-three { top: 89%; left: 78%; font-size: 22px; animation-delay: -8s; }
    .ambient-orb { width: 10px; height: 10px; border: 1px solid rgba(211,154,160,.55); border-radius: 50%; }
    .ambient-orb-one { top: 42%; left: 25%; animation-delay: -2s; }
    .ambient-orb-two { top: 82%; right: 24%; width: 7px; height: 7px; animation-delay: -11s; }
    .ambient-flower { bottom: -12vh; color: rgba(183,111,126,.45); font: 32px/1 var(--serif); animation: flower-rise 27s linear infinite; }
    .ambient-flower-one { left: 13%; animation-delay: -5s; }
    .ambient-flower-two { left: 38%; font-size: 25px; animation-delay: -18s; animation-duration: 33s; }
    .ambient-flower-three { left: 71%; font-size: 36px; animation-delay: -11s; animation-duration: 30s; }
    .ambient-flower-four { left: 91%; font-size: 22px; animation-delay: -24s; animation-duration: 35s; }
    .ambient-balloon { bottom: -14vh; width: 24px; height: 32px; border-radius: 50% 50% 46% 46%; background: var(--balloon-fill); box-shadow: inset -4px -3px 7px rgba(91,57,66,.12); animation: balloon-rise 31s linear infinite; }
    .ambient-balloon::before { position: absolute; bottom: -4px; left: 10px; width: 5px; height: 6px; background: var(--balloon-fill); clip-path: polygon(0 0,100% 0,50% 100%); content: ""; }
    .ambient-balloon::after { position: absolute; top: calc(100% + 5px); left: 12px; width: 1px; height: 58px; border-left: 1px solid rgba(117,84,91,.26); content: ""; }
    .ambient-balloon-one { left: 27%; --balloon-fill: rgba(207,139,153,.5); animation-delay: -19s; }
    .ambient-balloon-two { left: 61%; width: 19px; height: 26px; --balloon-fill: rgba(225,176,126,.48); animation-delay: -7s; animation-duration: 36s; }
    .ambient-balloon-three { left: 84%; width: 28px; height: 37px; --balloon-fill: rgba(164,148,185,.4); animation-delay: -27s; animation-duration: 34s; }
    @keyframes flower-rise { 0% { opacity: 0; transform: translate3d(0,0,0) rotate(-35deg) scale(.7); } 12% { opacity: .65; } 50% { transform: translate3d(36px,-56vh,0) rotate(120deg) scale(1); } 86% { opacity: .55; } 100% { opacity: 0; transform: translate3d(-28px,-112vh,0) rotate(260deg) scale(.8); } }
    @keyframes balloon-rise { 0% { opacity: 0; transform: translate3d(0,0,0) rotate(-8deg); } 12% { opacity: .62; } 48% { transform: translate3d(24px,-54vh,0) rotate(8deg); } 86% { opacity: .56; } 100% { opacity: 0; transform: translate3d(-18px,-112vh,0) rotate(-10deg); } }
    .skip-link { position: absolute; top: -60px; left: 12px; z-index: 10; padding: 10px; background: #fffaf1; color: var(--wine); }
    .skip-link:focus { top: 10px; }
    .topbar {
      width: min(1180px, calc(100% - 64px));
      min-height: 74px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid rgba(125,89,83,.2);
    }
    .brand { display: flex; align-items: center; gap: 10px; color: #765b5c; font-size: 11px; font-weight: 700; letter-spacing: .19em; text-transform: uppercase; }
    .brand-mark { width: 27px; height: 27px; color: var(--wine); }
    .topbar-note { color: var(--muted); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    .music-control { position: relative; display: flex; align-items: center; }
    .music-button {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid rgba(165,80,98,.34);
      border-radius: 999px;
      background: rgba(255,250,241,.64);
      color: #8d4356;
      font: 600 10px/1 var(--sans);
      letter-spacing: .09em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .2s, background .2s, box-shadow .2s;
    }
    .music-button svg { width: 15px; height: 15px; }
    .music-button:hover { transform: translateY(-2px); background: #fffaf1; box-shadow: 0 6px 18px rgba(79,49,48,.1); }
    .music-button[aria-pressed="true"] { background: #f0e0dc; }
    .music-button:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--wine); outline-offset: 4px; }
    .music-status { position: absolute; top: calc(100% + 8px); right: 0; z-index: 5; width: max-content; max-width: 230px; padding: 8px 10px; border: 1px solid rgba(165,80,98,.25); border-radius: 5px; background: #fffaf1; box-shadow: 0 8px 20px rgba(79,49,48,.1); color: #80666a; font-size: 11px; line-height: 1.45; }
    .music-status:empty { display: none; }
    .hero {
      width: min(1180px, calc(100% - 64px));
      min-height: 690px;
      margin: auto;
      display: grid;
      grid-template-columns: .91fr 1.09fr;
      align-items: center;
      gap: clamp(35px, 7vw, 112px);
      padding: 54px 0 80px;
    }
    .hero-copy { padding-left: clamp(0px, 3vw, 40px); }
    .eyebrow, .section-kicker { color: var(--wine); font-size: 10px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 25px 0 23px; color: #573b42; font: 500 clamp(58px, 8.1vw, 112px)/.96 var(--serif); letter-spacing: -.055em; }
    h1 em { color: var(--wine); font-weight: 500; }
    .hero-description { max-width: 350px; margin: 0; color: #776568; font-size: 15px; line-height: 1.8; }
    .hero-link { display: inline-flex; align-items: center; gap: 13px; margin-top: 33px; color: #8d4356; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; }
    .hero-link svg { width: 16px; transition: transform .25s; }
    .hero-link:hover svg { transform: translateY(4px); }
    .hero-art { position: relative; min-height: 495px; display: grid; place-items: center; }
    .hero-photo {
      position: relative;
      width: min(100%, 260px);
      height: 310px;
      padding: 10px 10px 43px;
      border: 0;
      background: #fffaf1;
      box-shadow: 0 22px 55px rgba(79,49,48,.2);
      color: inherit;
      text-align: left;
      transform: rotate(2.2deg);
      transform-origin: 60% 50%;
      animation: cover-photo-arrive 1.15s cubic-bezier(.2,.7,.2,1) .12s both;
      cursor: zoom-in;
    }
    .hero-photo img { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(.82); transition: transform .9s cubic-bezier(.2,.7,.2,1); }
    .hero-photo:hover img { transform: scale(1.045); }
    .photo-label { position: absolute; right: 22px; bottom: 16px; color: #856c68; font: italic 15px var(--serif); }
    .photo-trigger { appearance: none; -webkit-appearance: none; }
    .photo-zoom-hint {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      padding: 7px 9px;
      border: 1px solid rgba(255,250,241,.42);
      border-radius: 999px;
      background: rgba(69,53,58,.7);
      color: #fffaf1;
      font: 600 8px/1 var(--sans);
      letter-spacing: .12em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .tape { position: absolute; top: 12px; left: 50%; z-index: 2; width: 118px; height: 31px; background: rgba(211,164,153,.58); transform: translateX(-50%) rotate(-3deg); }
    .floating-stamp { position: absolute; left: 2%; bottom: 5%; width: 122px; height: 122px; display: grid; place-items: center; border: 1px solid rgba(165,80,98,.55); border-radius: 50%; background: rgba(245,239,228,.82); color: var(--wine); font: italic 16px/1.2 var(--serif); text-align: center; transform: rotate(-12deg); }
    .floating-stamp::before { content: ""; position: absolute; inset: 7px; border: 1px dashed rgba(165,80,98,.45); border-radius: 50%; }
    .float-heart { position: absolute; color: #b96978; opacity: .48; animation: drift 7s ease-in-out infinite; }
    .float-heart svg { width: 25px; height: 25px; }
    .heart-one { top: 10%; right: 3%; animation-delay: -2s; }
    .heart-two { top: 24%; left: 2%; transform: scale(.72); animation-delay: -4s; }
    .heart-three { right: 5%; bottom: 20%; transform: scale(.6); animation-delay: -1s; }
    .intro-note { width: min(670px, calc(100% - 40px)); margin: 0 auto 110px; color: #79666a; font: italic 21px/1.7 var(--serif); text-align: center; }
    .intro-note span { color: var(--wine); }
    .memory-section { width: min(1120px, calc(100% - 64px)); margin: 0 auto; padding-bottom: 120px; }
    .section-heading { margin-bottom: 66px; text-align: center; }
    .section-heading h2 { margin: 15px 0 13px; color: #573b42; font: 500 clamp(42px, 6vw, 72px)/1.05 var(--serif); letter-spacing: -.035em; }
    .section-heading p { margin: 0; color: var(--muted); font-size: 13px; }
    .memory { max-width: 780px; margin: 0 auto 105px; display: grid; grid-template-columns: .82fr 1.18fr; align-items: center; gap: clamp(38px, 7vw, 80px); }
    .memory:nth-of-type(even) { grid-template-columns: 1.18fr .82fr; }
    .memory:nth-of-type(even) .memory-art { order: 2; }
    .memory:nth-of-type(even) .memory-copy { order: 1; }
    .memory-art {
      position: relative;
      display: block;
      width: min(100%, 210px);
      justify-self: center;
      padding: 10px;
      border: 0;
      background: #fffaf1;
      box-shadow: 0 17px 42px rgba(79,49,48,.13);
      color: inherit;
      text-align: left;
      cursor: zoom-in;
      transform-origin: center;
      transition: box-shadow .45s;
    }
    .memory-art:hover { box-shadow: 0 26px 56px rgba(79,49,48,.2); }
    .memory-art::before { content: ""; position: absolute; inset: 8px; z-index: 1; border: 1px solid rgba(130,101,94,.14); pointer-events: none; }
    .memory-art img { display: block; width: 100%; aspect-ratio: 1.02 / 1; object-fit: cover; filter: saturate(.78); transition: transform .75s cubic-bezier(.2,.7,.2,1), filter .75s; }
    .memory-art:hover img { filter: saturate(1); transform: scale(1.055); }
    .memory:nth-of-type(4n+2) .memory-art { transform: rotate(-1.5deg); }
    .memory:nth-of-type(4n+3) .memory-art { transform: rotate(1.4deg); }
    .memory:nth-of-type(4n) .memory-art { transform: rotate(-1deg); }
    .memory-art.memory-video-art { width: min(100%, 210px); cursor: zoom-in; }
    .video-play-mark { position: absolute; top: 50%; left: 50%; z-index: 2; display: grid; width: 50px; height: 50px; place-items: center; border: 1px solid rgba(255,250,241,.72); border-radius: 50%; background: rgba(69,53,58,.64); box-shadow: 0 4px 20px rgba(0,0,0,.18); color: #fffaf1; font-size: 17px; pointer-events: none; transform: translate(-50%,-50%); }
    .memory-copy { max-width: 365px; }
    .memory-index { color: #a27c77; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
    .memory-copy h3 { margin: 17px 0; color: #68474e; font: 500 clamp(34px, 4vw, 48px)/1.1 var(--serif); }
    .memory-copy p { margin: 0; color: #766366; font-size: 14px; line-height: 1.9; }
    .memory-copy .memory-caption { margin-top: 22px; color: #9a6470; font: italic 16px/1.6 var(--serif); }
    .memory-caption::before { content: "“"; margin-right: 3px; color: #bf8290; font-size: 24px; }
    .memory-caption::after { content: "”"; margin-left: 3px; color: #bf8290; font-size: 24px; }
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s, transform .8s cubic-bezier(.2,.7,.2,1); }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }
    .typing-char { display: inline; opacity: 0; white-space: pre-wrap; }
    .reveal.is-visible .typing-char, .typing-now .typing-char { animation: type-letter .04s steps(1,end) var(--type-delay,0ms) both; }
    @keyframes type-letter { from { opacity: 0; transform: translateY(.2em); } to { opacity: 1; transform: translateY(0); } }
    .memory.text-only-memory { grid-template-columns: 1fr; }
    .memory.text-only-memory .memory-copy { max-width: 640px; justify-self: center; padding: clamp(28px,5vw,54px); border: 1px solid rgba(165,80,98,.2); border-radius: 48% 52% 47% 53% / 5% 6% 7% 8%; background: rgba(255,250,241,.56); box-shadow: 0 16px 45px rgba(79,49,48,.08); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .media-error { min-height: 0; margin: 0; color: #8f3543; text-align: center; font-size: 13px; }
    .birthday-note { position: relative; overflow: hidden; padding: 112px 24px 125px; background: #ead8cf; color: #573b42; text-align: center; }
    .birthday-note::before, .birthday-note::after { content: ""; position: absolute; width: 230px; height: 230px; border: 1px solid rgba(165,80,98,.2); border-radius: 50%; }
    .birthday-note::before { top: -100px; left: -105px; }
    .birthday-note::after { right: -115px; bottom: -115px; }
    .letter-card { position: relative; max-width: 700px; margin: 0 auto; }
    .letter-flourish { width: 30px; height: 30px; margin-bottom: 20px; color: var(--wine); }
    .letter-card h2 { margin: 0 0 24px; font: 500 clamp(48px, 7vw, 82px)/1.04 var(--serif); letter-spacing: -.04em; }
    .letter-to { margin: 0 0 24px; color: var(--wine); font: italic 22px var(--serif); }
    .letter-card p { max-width: 550px; margin: 0 auto; color: #715b60; font-size: 15px; line-height: 1.95; }
    .letter-card .letter-signoff { margin-top: 34px; color: #8f4c5d; font: italic 22px/1.6 var(--serif); }
    .letter-small { display: block; margin-top: 42px; color: #987a78; font-size: 9px; letter-spacing: .22em; text-transform: uppercase; }
    .footer { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 30px 20px 34px; color: #9a8180; font-size: 10px; letter-spacing: .1em; text-align: center; }
    .birthday-cta { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; gap: 10px; padding: 0 25px; border: 1px solid var(--wine); border-radius: 999px; background: var(--wine); box-shadow: 0 8px 22px rgba(79,49,48,.14); color: #fffaf1; font: 600 11px/1 var(--sans); letter-spacing: .16em; text-decoration: none; text-transform: uppercase; transition: transform .2s, background .2s, box-shadow .2s; }
    .birthday-cta svg { width: 14px; height: 14px; }
    .birthday-cta:hover { transform: translateY(-2px); background: #8f4355; box-shadow: 0 12px 28px rgba(79,49,48,.2); }
    .birthday-cta {
      position: relative; overflow: hidden; min-height: 54px; padding: 0 30px;
      border-color: rgba(255,245,221,.8);
      background: linear-gradient(120deg,#a55062 0%,#bb6672 52%,#8f4355 100%);
      font-weight: 700; letter-spacing: .12em;
      box-shadow: 0 12px 28px rgba(108,52,67,.24),0 0 0 5px rgba(165,80,98,.08);
      animation: cta-pulse 3.4s ease-in-out infinite;
    }
    .birthday-cta::before { position: absolute; inset: 0 auto 0 -55%; width: 42%; background: linear-gradient(100deg,transparent,rgba(255,255,255,.36),transparent); content: ""; transform: skewX(-18deg); animation: cta-shimmer 4.6s ease-in-out infinite; }
    .birthday-cta span, .birthday-cta svg { position: relative; z-index: 1; }
    .birthday-cta svg { width: 17px; height: 17px; transition: transform .25s ease; }
    .birthday-cta:hover { transform: translateY(-4px) scale(1.025); filter: saturate(1.12); box-shadow: 0 18px 36px rgba(79,49,48,.25),0 0 0 7px rgba(165,80,98,.09); }
    .birthday-cta:hover svg { transform: rotate(12deg) scale(1.18); }
    @keyframes cta-pulse { 0%,100% { box-shadow: 0 12px 28px rgba(108,52,67,.24),0 0 0 5px rgba(165,80,98,.08); } 50% { box-shadow: 0 15px 32px rgba(108,52,67,.29),0 0 0 9px rgba(165,80,98,.04); } }
    @keyframes cta-shimmer { 0%,42%,100% { left: -55%; } 58% { left: 120%; } }
    .birthday-cta:focus-visible { outline: 2px solid var(--wine); outline-offset: 4px; }
    .photo-lightbox { position: fixed; inset: 0; z-index: 1000; display: grid; grid-template-rows: minmax(0, 1fr) auto; place-items: center; padding: clamp(22px,4vw,52px); background: rgba(35,23,29,.88); color: #fffaf1; backdrop-filter: blur(16px) saturate(120%); opacity: 0; visibility: hidden; transition: opacity .34s, visibility 0s linear .34s; }
    .photo-lightbox[hidden] { display: none !important; }
    .photo-lightbox.is-open { opacity: 1; visibility: visible; transition-delay: 0s; }
    .photo-lightbox::before { content: ""; position: absolute; z-index: -1; width: min(70vw,760px); aspect-ratio: 1; border-radius: 50%; background: conic-gradient(from 30deg,rgba(226,153,173,.32),rgba(231,192,147,.18),rgba(176,150,201,.28),rgba(226,153,173,.32)); filter: blur(64px); opacity: .7; animation: lightbox-aura 18s linear infinite; }
    .lightbox-close { position: absolute; top: max(18px,env(safe-area-inset-top)); right: max(18px,env(safe-area-inset-right)); z-index: 2; width: 44px; height: 44px; border: 1px solid rgba(255,250,241,.42); border-radius: 50%; background: rgba(255,250,241,.12); color: #fffaf1; font: 300 30px/1 var(--sans); cursor: pointer; transition: transform .2s, background .2s; }
    .lightbox-close:hover { transform: rotate(90deg); background: rgba(255,250,241,.24); }
    .lightbox-frame { position: relative; z-index: 1; grid-row: 1; display: grid; justify-items: center; max-width: 100%; max-height: 100%; margin: 0; }
    .lightbox-frame img, .lightbox-frame video { display: block; max-width: min(88vw,1100px); max-height: 78vh; width: auto; height: auto; border: 8px solid #fffaf1; border-bottom-width: 30px; border-radius: 4px; background: #fffaf1; box-shadow: 0 30px 100px rgba(0,0,0,.48), 0 0 55px rgba(233,174,194,.2); object-fit: contain; }
    .lightbox-frame video { width: min(88vw,1100px); aspect-ratio: 16 / 9; background: #1f1a1c; }
    .lightbox-frame img[hidden], .lightbox-frame video[hidden] { display: none !important; }
    .lightbox-frame figcaption { margin-top: 15px; color: rgba(255,250,241,.92); font: italic 20px/1.4 var(--serif); text-align: center; }
    .lightbox-instruction { position: relative; z-index: 1; grid-row: 2; margin: 14px 0 0; color: rgba(255,250,241,.6); font-size: 9px; letter-spacing: .16em; text-align: center; text-transform: uppercase; }
    .lightbox-frame.is-entering { animation: lightbox-photo-in .62s cubic-bezier(.16,1,.3,1) both; }
    @keyframes drift { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-13px) rotate(8deg); } }
    @keyframes birthday-float { 0%,100% { transform: translate3d(0,8px,0) rotate(-8deg); } 50% { transform: translate3d(10px,-24px,0) rotate(10deg); } }
    @keyframes birthday-twinkle { 0%,100% { opacity: .28; transform: scale(.8) rotate(0); } 50% { opacity: .85; transform: scale(1.2) rotate(20deg); } }
    @keyframes paper-aurora { 0% { transform: translate3d(-1.2%,0,0) scale(1); } 50% { transform: translate3d(1.4%,-1%,0) scale(1.035); } 100% { transform: translate3d(-.6%,1.2%,0) scale(1.02); } }
    @keyframes cover-photo-arrive { 0% { opacity: 0; transform: translate(28px,24px) rotate(8deg) scale(.94); } 72% { opacity: 1; } 100% { opacity: 1; transform: rotate(2.2deg) scale(1); } }
    @keyframes lightbox-photo-in { 0% { opacity: 0; transform: translateY(22px) scale(.42) rotate(-4deg); filter: blur(8px); } 72% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); filter: blur(0); } }
    @keyframes lightbox-aura { to { transform: rotate(360deg) scale(1.08); } }
    @media (max-width: 760px) {
      .topbar { width: calc(100% - 36px); min-height: 62px; }
      .topbar-note { display: none; }
      .music-button { min-height: 36px; padding: 0 11px; font-size: 9px; }
      .hero { width: calc(100% - 38px); min-height: auto; grid-template-columns: 1fr; gap: 28px; padding: 69px 0 52px; }
      .hero-copy { padding: 0 8px; }
      h1 { font-size: clamp(62px,18vw,98px); margin: 20px 0; }
      .hero-description { font-size: 14px; }
      .hero-art { min-height: 330px; margin: 0 7px; }
      .hero-photo { width: min(100%,220px); height: 270px; }
      .floating-stamp { left: -4px; bottom: 0; width: 98px; height: 98px; font-size: 14px; }
      .intro-note { margin-bottom: 78px; font-size: 18px; }
      .memory-section { width: calc(100% - 40px); padding-bottom: 54px; }
      .section-heading { margin-bottom: 48px; }
      .memory, .memory:nth-of-type(even) { grid-template-columns: 1fr; gap: 27px; margin-bottom: 75px; }
      .memory:nth-of-type(even) .memory-art, .memory:nth-of-type(even) .memory-copy { order: initial; }
      .memory-art { width: min(100%,185px); }
      .memory-art.memory-video-art { width: min(100%,185px); }
      .memory-copy { max-width: 490px; justify-self: center; padding: 0 8px; }
      .memory-copy h3 { font-size: 39px; }
      .birthday-note { padding: 86px 24px 96px; }
      .letter-card p { font-size: 14px; }
      .photo-lightbox { padding: 20px 14px max(24px,env(safe-area-inset-bottom)); }
      .lightbox-frame img, .lightbox-frame video { max-width: 92vw; max-height: 72vh; border-width: 6px; border-bottom-width: 22px; }
      .lightbox-frame figcaption { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .reveal { opacity: 1; transform: none; }
      .scrapbook::after, .photo-lightbox::before, .ambient-shape { animation: none !important; }
    }
  </style>
</head>
<body>
  <!--
    EASY TEXT EDITING:
    Search for "EDIT TEXT:" below to find the headline, each memory, and the birthday letter.
    Replace the words between the HTML tags; keep the tags and <br>/<em> formatting.
    The live React page has matching text in src/App.tsx.
  -->
  <main class="scrapbook">
    <div class="ambient-birthday" aria-hidden="true">
      <span class="ambient-shape ambient-heart ambient-heart-one">♡</span>
      <span class="ambient-shape ambient-star ambient-star-one">✦</span>
      <span class="ambient-shape ambient-heart ambient-heart-two">♡</span>
      <span class="ambient-shape ambient-star ambient-star-two">✧</span>
      <span class="ambient-shape ambient-heart ambient-heart-three">♡</span>
      <span class="ambient-shape ambient-flower ambient-flower-one">✿</span>
      <span class="ambient-shape ambient-flower ambient-flower-two">❀</span>
      <span class="ambient-shape ambient-flower ambient-flower-three">✿</span>
      <span class="ambient-shape ambient-flower ambient-flower-four">❀</span>
      <span class="ambient-shape ambient-balloon ambient-balloon-one"></span>
      <span class="ambient-shape ambient-balloon ambient-balloon-two"></span>
      <span class="ambient-shape ambient-balloon ambient-balloon-three"></span>
      <span class="ambient-shape ambient-orb ambient-orb-one"></span>
      <span class="ambient-shape ambient-orb ambient-orb-two"></span>
    </div>
    <a class="skip-link" href="#memories">Skip to the memories</a>
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 27s-11-6.8-11-15a6.2 6.2 0 0 1 11-3.9A6.2 6.2 0 0 1 27 12c0 8.2-11 15-11 15Z" stroke="currentColor" stroke-width="1.5"/></svg>
        <span id="brand-copy"></span>
      </div>
      <span class="topbar-note" id="topbar-note"></span>
      <div class="music-control">
        <button class="music-button" id="music-button" type="button" aria-pressed="false" aria-label="Play the birthday music">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18V5l12-2v13M9 18c0 1.1-1.3 2-3 2s-3-.9-3-2 1.3-2 3-2 3 .9 3 2Zm12-2c0 1.1-1.3 2-3 2s-3-.9-3-2 1.3-2 3-2 3 .9 3 2ZM9 8l12-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="music-label"></span>
        </button>
        <span class="music-status" id="music-status" role="status" aria-live="polite"></span>
      </div>
    </header>
    <!-- MUSIC FILE: The uploaded track is in public/sample-music.mp3. -->
    <audio id="birthday-music" src="/sample-music.mp3" preload="auto" loop autoplay hidden></audio>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <span class="eyebrow" id="hero-eyebrow"></span>
        <h1 id="hero-title"></h1>
        <p class="hero-description" id="hero-description"></p>
        <a class="hero-link" href="#memories"><span id="hero-link-label"></span> <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3v13m0 0 5-5m-5 5-5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
      <div class="hero-art">
        <span class="float-heart heart-one" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 27s-11-6.8-11-15a6.2 6.2 0 0 1 11-3.9A6.2 6.2 0 0 1 27 12c0 8.2-11 15-11 15Z" stroke="currentColor" stroke-width="1.4"/></svg></span>
        <span class="float-heart heart-two" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 27s-11-6.8-11-15a6.2 6.2 0 0 1 11-3.9A6.2 6.2 0 0 1 27 12c0 8.2-11 15-11 15Z" stroke="currentColor" stroke-width="1.4"/></svg></span>
        <span class="float-heart heart-three" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 27s-11-6.8-11-15a6.2 6.2 0 0 1 11-3.9A6.2 6.2 0 0 1 27 12c0 8.2-11 15-11 15Z" stroke="currentColor" stroke-width="1.4"/></svg></span>
        <button class="hero-photo photo-trigger" id="cover-photo" type="button" aria-label="Enlarge the cover photo">
          <span class="tape" aria-hidden="true"></span>
          <img id="cover-image" src="/first-photo.jpg" alt="">
          <span class="photo-zoom-hint" aria-hidden="true">Tap to zoom</span>
          <span class="photo-label" id="cover-photo-label"></span>
        </button>
        <div class="floating-stamp" aria-hidden="true">you make<br>life lovely</div>
      </div>
    </section>

    <p class="intro-note reveal" id="intro-note"></p>
    <section class="memory-section" id="memories" aria-labelledby="memory-heading">
      <div class="section-heading reveal">
        <span class="section-kicker" id="memories-kicker"></span>
        <h2 id="memory-heading"></h2>
        <p id="memories-description"></p>
      </div>
      <p class="media-error" id="media-error" role="status" aria-live="polite"></p>
      <div id="memories-list"></div>
      <div id="added-media"></div>
    </section>

    <section class="birthday-note" aria-labelledby="letter-heading">
      <div class="letter-card reveal">
        <svg class="letter-flourish" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 27s-11-6.8-11-15a6.2 6.2 0 0 1 11-3.9A6.2 6.2 0 0 1 27 12c0 8.2-11 15-11 15Z" stroke="currentColor" stroke-width="1.4"/></svg>
        <p class="letter-to" id="letter-to"></p>
        <h2 id="letter-heading"></h2>
        <p id="letter-paragraph"></p>
        <p class="letter-signoff" id="letter-signoff"></p>
        <span class="letter-small" id="letter-small"></span>
      </div>
    </section>
    <footer class="footer">
      <a class="birthday-cta" id="birthday-cta" href="https://for-bday.onrender.com/" target="_blank" rel="noopener noreferrer">
        <span id="birthday-cta-label"></span> <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m10 2 1.4 5.1L16 9l-4.6 1.8L10 16l-1.4-5.2L4 9l4.6-1.9L10 2Zm7 10 .8 2.3L20 15l-2.2.8L17 18l-.8-2.2L14 15l2.2-.7L17 12Z" fill="currentColor"/></svg>
      </a>
      <span id="footer-note"></span>
    </footer>
  </main>

  <div class="photo-lightbox" id="photo-lightbox" role="dialog" aria-modal="true" aria-label="Enlarged scrapbook media" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close enlarged media">×</button>
    <figure class="lightbox-frame" id="lightbox-frame">
      <img id="lightbox-image" alt="">
      <video id="lightbox-video" controls playsinline hidden></video>
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <p class="lightbox-instruction">Press Esc or click outside the media to close</p>
  </div>

  <script>
    (() => {
      const lightbox = document.getElementById('photo-lightbox');
      const lightboxImage = document.getElementById('lightbox-image');
      const lightboxVideo = document.getElementById('lightbox-video');
      const lightboxCaption = document.getElementById('lightbox-caption');
      const lightboxFrame = document.getElementById('lightbox-frame');
      const closeButton = document.getElementById('lightbox-close');
      let previousFocus = null;
      let previousOverflow = '';
      let closeTimer = null;

      function openPhoto(button) {
        const image = button.querySelector('img');
        if (!image) return;
        if (closeTimer !== null) window.clearTimeout(closeTimer);
        previousFocus = button;
        previousOverflow = document.body.style.overflow;
        lightboxVideo.pause();
        lightboxVideo.removeAttribute('src');
        lightboxVideo.load();
        lightboxVideo.hidden = true;
        lightboxImage.hidden = false;
        lightboxImage.src = image.currentSrc || image.src;
        lightboxImage.alt = image.alt;
        lightboxCaption.textContent = button.dataset.photoTitle || image.alt;
        lightbox.setAttribute('aria-label', `Enlarged photo: ${lightboxCaption.textContent}`);
        lightbox.hidden = false;
        lightboxFrame.classList.remove('is-entering');
        document.body.style.overflow = 'hidden';
        requestAnimationFrame(() => {
          lightbox.classList.add('is-open');
          lightboxFrame.classList.add('is-entering');
        });
        closeButton.focus();
      }

      function openVideo(button) {
        if (closeTimer !== null) window.clearTimeout(closeTimer);
        previousFocus = button;
        previousOverflow = document.body.style.overflow;
        lightboxImage.hidden = true;
        lightboxVideo.src = button.dataset.videoSrc;
        lightboxVideo.poster = button.dataset.videoPoster;
        lightboxVideo.hidden = false;
        lightboxCaption.textContent = button.dataset.videoTitle || 'A moving memory';
        lightbox.setAttribute('aria-label', `Enlarged video: ${lightboxCaption.textContent}`);
        lightbox.hidden = false;
        lightboxFrame.classList.remove('is-entering');
        document.body.style.overflow = 'hidden';
        void lightboxVideo.play().catch(() => {});
        requestAnimationFrame(() => {
          lightbox.classList.add('is-open');
          lightboxFrame.classList.add('is-entering');
        });
        closeButton.focus();
      }

      function closeViewer() {
        if (lightbox.hidden) return;
        lightbox.classList.remove('is-open');
        lightboxFrame.classList.remove('is-entering');
        document.body.style.overflow = previousOverflow;
        lightboxVideo.pause();
        lightboxVideo.removeAttribute('src');
        lightboxVideo.load();
        lightboxVideo.hidden = true;
        closeTimer = window.setTimeout(() => {
          lightbox.hidden = true;
          closeTimer = null;
        }, 360);
        if (previousFocus && previousFocus.isConnected) previousFocus.focus();
      }

      function bindPhotoButton(button) {
        button.addEventListener('click', () => openPhoto(button));
      }
      function bindVideoButton(button) {
        button.addEventListener('click', () => openVideo(button));
      }
      document.querySelectorAll('.photo-trigger').forEach(bindPhotoButton);
      closeButton.addEventListener('click', closeViewer);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeViewer();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeViewer();
      });

      const revealObserver = 'IntersectionObserver' in window
        ? new IntersectionObserver((entries, observer) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
              }
            });
          }, { threshold: 0.14 })
        : null;
      function observeReveal(element) {
        if (revealObserver) revealObserver.observe(element);
        else element.classList.add('is-visible');
      }
      document.querySelectorAll('.reveal').forEach(observeReveal);

      const mediaContainer = document.getElementById('added-media');
      const memoriesList = document.getElementById('memories-list');
      const mediaError = document.getElementById('media-error');
      let addedPhotoCount = 0;
      const featuredPhotoNames = new Set();
      const publicDirectory = new URL('./', document.baseURI);
      const publicAssetUrl = (source) => new URL(source, publicDirectory).href;
      const readableTitle = (value) => typeof value === 'string' && value.trim() ? value.trim() : 'A favorite moment';
      const validEntry = (value) => value && typeof value.src === 'string' && typeof value.name === 'string' && typeof value.title === 'string';

      function typeText(element, value) {
        const text = String(value || '');
        element.textContent = '';
        element.setAttribute('aria-label', text);
        Array.from(text).forEach((character, index) => {
          const letter = document.createElement('span');
          letter.className = 'typing-char';
          letter.setAttribute('aria-hidden', 'true');
          letter.style.setProperty('--type-delay', `${index * 14}ms`);
          letter.textContent = character;
          element.append(letter);
        });
      }

      function addTypingLine(parent, text, tag = 'span') {
        const line = document.createElement(tag);
        typeText(line, text);
        parent.append(line);
        return line;
      }

      function makeMemoryCopy(number, kicker, title, description, caption) {
        const copyContainer = document.createElement('div');
        copyContainer.className = 'memory-copy';
        const index = document.createElement('span');
        index.className = 'memory-index';
        index.textContent = `${number} / ${kicker}`;
        const heading = document.createElement('h3');
        typeText(heading, title);
        const text = document.createElement('p');
        typeText(text, description);
        const note = document.createElement('p');
        note.className = 'memory-caption';
        typeText(note, caption);
        copyContainer.append(index, heading, text, note);
        return copyContainer;
      }

      async function loadContent() {
        const response = await fetch(publicAssetUrl('content.json'), { cache: 'no-store' });
        if (!response.ok) throw new Error(`Scrapbook content returned ${response.status}`);
        const content = await response.json();
        if (!content || !Array.isArray(content.memories) || content.memories.length < 8) {
          throw new Error('Scrapbook content must include memories 1 through 8');
        }
        window.birthdayCopy = content;
        document.getElementById('brand-copy').textContent = content.brandName;
        document.getElementById('topbar-note').textContent = content.topNote;
        document.getElementById('hero-eyebrow').textContent = content.hero.eyebrow;
        document.getElementById('hero-description').textContent = content.hero.description;
        document.getElementById('hero-link-label').textContent = content.hero.linkLabel;

        const heroTitle = document.getElementById('hero-title');
        heroTitle.classList.add('typing-now');
        const heroStart = document.createElement('span');
        typeText(heroStart, content.hero.headlineStart);
        const heroAccent = document.createElement('em');
        typeText(heroAccent, content.hero.headlineAccent);
        heroTitle.append(heroStart, document.createElement('br'), heroAccent);
        heroTitle.setAttribute('aria-label', `${content.hero.headlineStart} ${content.hero.headlineAccent}`);
        const cover = document.getElementById('cover-photo');
        const coverImage = document.getElementById('cover-image');
        cover.dataset.photoTitle = content.hero.photoTitle;
        coverImage.src = publicAssetUrl(content.hero.photo);
        coverImage.alt = content.hero.photoAlt;
        document.getElementById('cover-photo-label').textContent = content.hero.photoLabel;

        const intro = document.getElementById('intro-note');
        intro.append(document.createTextNode(content.intro.before));
        const introHighlight = document.createElement('span');
        typeText(introHighlight, content.intro.highlight);
        intro.append(introHighlight);

        document.getElementById('memories-kicker').textContent = content.memoriesHeading.kicker;
        typeText(document.getElementById('memory-heading'), content.memoriesHeading.title);
        document.getElementById('memories-description').textContent = content.memoriesHeading.description;
        typeText(document.getElementById('letter-to'), content.letter.to);
        const letterHeading = document.getElementById('letter-heading');
        typeText(letterHeading, content.letter.titleStart);
        letterHeading.append(document.createElement('br'));
        addTypingLine(letterHeading, content.letter.titleRecipient);
        letterHeading.setAttribute('aria-label', `${content.letter.titleStart} ${content.letter.titleRecipient}`);
        typeText(document.getElementById('letter-paragraph'), content.letter.paragraph);
        const signoff = document.getElementById('letter-signoff');
        typeText(signoff, content.letter.signoff);
        signoff.append(document.createElement('br'));
        addTypingLine(signoff, content.letter.signoffName);
        signoff.setAttribute('aria-label', `${content.letter.signoff} ${content.letter.signoffName}`);
        document.getElementById('letter-small').textContent = content.letter.small;

        const cta = document.getElementById('birthday-cta');
        cta.href = content.button.href;
        cta.setAttribute('aria-label', content.button.ariaLabel);
        document.getElementById('birthday-cta-label').textContent = content.button.label;
        document.getElementById('footer-note').textContent = content.button.footerNote;
        const audio = document.getElementById('birthday-music');
        const musicButton = document.getElementById('music-button');
        const musicLabel = audio.paused ? content.music.playLabel : content.music.pauseLabel;
        document.getElementById('music-label').textContent = musicLabel;
        musicButton.setAttribute('aria-label', musicLabel);
        document.querySelectorAll('.photo-zoom-hint').forEach((hint) => {
          if (!hint.closest('.video-trigger')) hint.textContent = content.photoHint;
        });

        content.memories.forEach((memory) => {
          if (memory.image) featuredPhotoNames.add(memory.image.split('/').pop().toLowerCase());
          const article = document.createElement('article');
          article.className = `memory reveal${memory.image ? '' : ' text-only-memory'}`;
          if (memory.image) {
            const button = document.createElement('button');
            button.className = 'memory-art photo-trigger';
            button.type = 'button';
            button.dataset.photoTitle = memory.title;
            button.setAttribute('aria-label', `Enlarge photo: ${memory.title}`);
            const image = document.createElement('img');
            image.src = publicAssetUrl(memory.image);
            image.alt = memory.alt || memory.title;
            image.loading = 'lazy';
            const hint = document.createElement('span');
            hint.className = 'photo-zoom-hint';
            hint.textContent = content.photoHint;
            button.append(image, hint);
            article.append(button);
            bindPhotoButton(button);
          }
          article.append(makeMemoryCopy(
            memory.number,
            memory.chapter,
            memory.title,
            memory.text,
            memory.caption,
          ));
          memoriesList.append(article);
          observeReveal(article);
        });
        featuredPhotoNames.add(content.hero.photo.split('/').pop().toLowerCase());
        return content;
      }

      async function loadPublicMedia(content) {
        try {
          const response = await fetch(publicAssetUrl('photos.json'), { cache: 'no-store' });
          if (!response.ok) throw new Error(`Photo manifest returned ${response.status}`);
          const entries = await response.json();
          if (!Array.isArray(entries) || !entries.every(validEntry)) throw new Error('Invalid photo manifest');
          const extraPhotos = entries.filter((photo) => {
            let filename = photo.src.split('/').pop() || '';
            try { filename = decodeURIComponent(filename); } catch {}
            return !featuredPhotoNames.has(filename.toLowerCase());
          });
          addedPhotoCount = extraPhotos.length;

          extraPhotos.forEach((photo, index) => {
            const title = readableTitle(photo.title);
            const article = document.createElement('article');
            article.className = 'memory reveal';
            const button = document.createElement('button');
            button.className = 'memory-art photo-trigger';
            button.type = 'button';
            button.dataset.photoTitle = title;
            button.setAttribute('aria-label', `Enlarge photo: ${title}`);
            const image = document.createElement('img');
            image.src = publicAssetUrl(photo.src);
            image.alt = `Added scrapbook photo: ${title}`;
            image.loading = 'lazy';
            const hint = document.createElement('span');
            hint.className = 'photo-zoom-hint';
            hint.setAttribute('aria-hidden', 'true');
            hint.textContent = content.photoHint;
            button.append(image, hint);
            article.append(
              button,
              makeMemoryCopy(
                String(content.memories.length + index + 1).padStart(2, '0'),
                content.media.addedPhotoChapter,
                title,
                content.media.addedPhotoDescription,
                title,
              ),
            );
            mediaContainer.append(article);
            bindPhotoButton(button);
            observeReveal(article);
          });
        } catch {
          mediaError.textContent = content.media.photoLoadError;
        }

        try {
          const response = await fetch(publicAssetUrl('videos.json'), { cache: 'no-store' });
          if (!response.ok) throw new Error(`Video manifest returned ${response.status}`);
          const entries = await response.json();
          if (!Array.isArray(entries) || !entries.every(validEntry)) throw new Error('Invalid video manifest');

          entries.forEach((video, index) => {
            const title = readableTitle(video.title);
            const article = document.createElement('article');
            article.className = 'memory reveal memory-video';
            const button = document.createElement('button');
            button.className = 'memory-art memory-video-art video-trigger';
            button.type = 'button';
            button.dataset.videoSrc = publicAssetUrl(video.src);
            button.dataset.videoPoster = publicAssetUrl('sample-memory-7.jpg');
            button.dataset.videoTitle = title;
            button.setAttribute('aria-label', `Open video: ${title}`);
            const poster = document.createElement('img');
            poster.src = publicAssetUrl('sample-memory-7.jpg');
            poster.alt = `Preview for video: ${title}`;
            poster.loading = 'lazy';
            const playMark = document.createElement('span');
            playMark.className = 'video-play-mark';
            playMark.setAttribute('aria-hidden', 'true');
            playMark.textContent = '▶';
            const hint = document.createElement('span');
            hint.className = 'photo-zoom-hint';
            hint.setAttribute('aria-hidden', 'true');
            hint.textContent = content.media.videoHint;
            button.append(poster, playMark, hint);
            article.append(
              button,
              makeMemoryCopy(
                String(content.memories.length + addedPhotoCount + index + 1).padStart(2, '0'),
                content.media.videoChapter,
                title,
                content.media.videoDescription,
                'A moment worth watching again.',
              ),
            );
            mediaContainer.append(article);
            bindVideoButton(button);
            observeReveal(article);
          });
        } catch {
          mediaError.textContent = content.media.photoLoadError;
        }
      }
      loadContent()
        .then((content) => loadPublicMedia(content))
        .catch((error) => {
          mediaError.textContent = error instanceof Error
            ? `The scrapbook text could not be loaded: ${error.message}`
            : 'The scrapbook text could not be loaded.';
        });
    })();
  </script>
  <script>
    (() => {
      const button = document.getElementById('music-button');
      const label = document.getElementById('music-label');
      const status = document.getElementById('music-status');
      const audio = document.getElementById('birthday-music');
      audio.volume = 0.45;

      function syncButton() {
        const isPlaying = !audio.paused;
        const copy = window.birthdayCopy;
        const playLabel = copy ? copy.music.playLabel : 'Play music';
        const pauseLabel = copy ? copy.music.pauseLabel : 'Pause music';
        button.setAttribute('aria-pressed', String(isPlaying));
        button.setAttribute('aria-label', isPlaying ? pauseLabel : playLabel);
        label.textContent = isPlaying ? pauseLabel : playLabel;
        if (isPlaying) status.textContent = '';
      }

      async function startMusic() {
        try {
          await audio.play();
          status.textContent = '';
        } catch (playError) {
          status.textContent = playError && playError.name === 'NotAllowedError'
            ? 'Your browser blocked automatic music. Tap Play music to start it.'
            : 'The uploaded music could not be played. Please try again.';
        }
      }

      button.addEventListener('click', () => {
        if (audio.paused) void startMusic();
        else audio.pause();
      });
      audio.addEventListener('play', syncButton);
      audio.addEventListener('pause', syncButton);
      audio.addEventListener('error', () => {
        status.textContent = 'The uploaded music file could not be loaded.';
      });
      void startMusic();
      window.addEventListener('pagehide', () => audio.pause(), { once: true });
    })();
  </script>
</body>
</html>
